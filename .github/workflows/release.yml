name: Release
# Builds, signs with your Developer ID, notarizes, and publishes a GitHub Release.
# Started by hand (Actions › Release › Run workflow) with a version, so it never races a release
# published from a Mac with Scripts/release.sh. Needs these repository secrets (see docs/RELEASING.md):
#   DEVELOPER_ID_P12_BASE64, DEVELOPER_ID_P12_PASSWORD   the exported Developer ID Application certificate
#   NOTARY_KEY_P8_BASE64, NOTARY_KEY_ID, NOTARY_ISSUER_ID   an App Store Connect API key for notarization
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, like 0.2.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check inputs and secrets
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          KEY: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Version must look like 1.2.3"; exit 1; }
          [[ -n "$P12" && -n "$KEY" ]] || { echo "::error::Signing secrets aren't configured. See docs/RELEASING.md."; exit 1; }
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::v$VERSION is already released."; exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import the certificate into a temporary keychain
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/notchflow.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Save notarization credentials (API key)
        env:
          KEY: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          printf '%s' "$KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials notchflow --key "$RUNNER_TEMP/notary.p8" --key-id "$KEY_ID" \
            --issuer "$ISSUER" --keychain "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/notary.p8"

      - name: Test
        run: swift test

      - name: Build, sign, notarize, staple
        run: |
          NOTCHFLOW_VERSION="$VERSION" NOTCHFLOW_BUILD="$(git rev-list --count HEAD)" bash Scripts/build.sh
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/^.*"\(Developer ID Application: .*\)"$/\1/p' | head -1)"
          [[ -n "$IDENTITY" ]] || { echo "::error::No Developer ID Application identity in the certificate"; exit 1; }
          NOTCHFLOW_SIGN_IDENTITY="$IDENTITY" NOTCHFLOW_NOTARY_PROFILE=notchflow bash Scripts/notarize.sh
          spctl --assess --type execute --verbose=2 build/NotchFlow.app

      - name: Publish
        run: |
          ZIP="build/NotchFlow-$VERSION.zip"
          ditto -c -k --sequesterRsrc --keepParent build/NotchFlow.app "$ZIP"
          (cd build && shasum -a 256 "NotchFlow-$VERSION.zip" > "NotchFlow-$VERSION.zip.sha256")
          gh release create "v$VERSION" "$ZIP" "$ZIP.sha256" --target "$GITHUB_SHA" --title "NotchFlow $VERSION" --notes \
            "**Download \`NotchFlow-$VERSION.zip\`**, unzip, and drag **NotchFlow** to Applications. Signed with a Developer ID and notarized by Apple. Requires macOS 14.6 or later; Apple silicon and Intel."

      - name: Remove the temporary keychain
        if: always()
        run: |
          [[ -n "${KEYCHAIN:-}" ]] && security delete-keychain "$KEYCHAIN" || true
