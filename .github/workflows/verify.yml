name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s Tests -p 'test_*.py' -v
      - run: python3 Scripts/generate_project.py && git diff --exit-code -- NotchFlow.xcodeproj
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: bash Scripts/build.sh
      - run: xcrun -sdk macosx metal -c Resources/LiquidGlass.metal -o build/LiquidGlass.air
      - run: ditto -c -k --keepParent build/NotchFlow.app build/NotchFlow-unsigned-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: NotchFlow-unsigned-universal
          path: build/NotchFlow-unsigned-universal.zip
